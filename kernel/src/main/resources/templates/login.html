<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIT Tech Kernel | Sign In</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

    <main class="login-page">

        
        <section class="illustration-section">

            <img
                th:src="@{/images/login-illustration.png}"
                alt="Beyond the Obvious"
                class="login-illustration"
            >
        </section>


        
        <section class="login-section">

            <div class="logo-container">
                <img
                    th:src="@{/images/bon.png}"
                    alt="MIT Tech Kernel"
                    class="logo"
                >
            </div>


            <div class="login-container">

                <div class="login-heading">
                    <span class="technical-label">MIT TECH KERNEL</span>

                    <h1>Sign in</h1>

                    <p>
                        Access the technical club workspace.
                    </p>
                </div>


                <form
                    th:action="@{/login}"
                    method="post"
                    class="login-form"
                >

                    
                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >


                    
                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    
                    <button type="submit" class="login-button">
                        Sign in
                    </button>

                </form>


                <div class="login-footer">
                    <span>MITMUMBAI / TECH KERNEL</span>
                </div>

            </div>

        </section>

    </main>

</body>

</html>
