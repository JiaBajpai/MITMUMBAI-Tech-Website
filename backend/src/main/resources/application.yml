spring:
  application:
    name: tech-kernel-backend
  profiles:
    default: dev
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tech_kernel}
    username: ${DATABASE_USERNAME:tech_kernel}
    password: ${DATABASE_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration-production
    baseline-on-migrate: false
    validate-on-migrate: true
  sql:
    init:
      mode: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET:tech-kernel-development-secret-key-32-chars}
      access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:kernel_refresh}
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      path: /api/v1/auth
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@kernel.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/github/oauth/callback}
    scope: ${GITHUB_SCOPE:read:user}
    oauth-authorize-url: ${GITHUB_OAUTH_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
    oauth-token-url: ${GITHUB_OAUTH_TOKEN_URL:https://github.com/login/oauth/access_token}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    mail:
      enabled: ${MAIL_ENABLED:false}
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.mittechkernel.backend: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
